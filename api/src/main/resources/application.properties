spring.application.name=api
spring.datasource.url=${VOLLMED_DB_URL:jdbc:mysql://localhost:3306/vollmed_api}
spring.datasource.username=${VOLLMED_DB_USERNAME:root}
spring.datasource.password=${VOLLMED_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Secreto JWT para el metodo generarToken de la clase TokenService.
# ${VOLLMED_JWT_SECRET} es una variable de entorno PROPIA de este proyecto (prefijo VOLLMED_ para no
# chocar con variables globales de otros proyectos). El default es SOLO para desarrollo local.
# En produccion se debe definir siempre la variable de entorno.
# application-production.properties la exige SIN valor por defecto.
api.security.secret=${VOLLMED_JWT_SECRET:dev-secret-local-vollmed-3cambiar-en-produccion-9f4a}

# Limite de intentos fallidos de login por IP. Pasado el limite, la IP queda
# bloqueada durante seguridad.login.minutos-bloqueo.
seguridad.login.max-intentos=10
seguridad.login.minutos-ventana=15
seguridad.login.minutos-bloqueo=15

spring.flyway.out-of-order=true
spring.flyway.ignore-missing-migrations=true
spring.flyway.ignore-ignored-migrations=true
