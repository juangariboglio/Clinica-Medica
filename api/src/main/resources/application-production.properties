spring.application.name=api
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

# La conexion a MySQL debe usar TLS en produccion.
spring.datasource.hikari.data-source-properties.sslMode=REQUIRED

# En produccion el secreto JWT es obligatorio: sin valor por defecto.
api.security.secret=${VOLLMED_JWT_SECRET}

# Origen exacto del frontend autorizado para el WebSocket (sin valor por defecto).
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}

# La documentacion interactiva no debe quedar publica en produccion.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# No devolver detalles internos en las respuestas de error.
server.error.include-stacktrace=never
server.error.include-message=never